name: Build JARVIS for Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained exe
        run: dotnet publish src/Jarvis.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64
          path: publish/**
          retention-days: 30
